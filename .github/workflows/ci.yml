name: CI - pipeline, pruebas y calidad (SonarCloud)

# Se ejecuta en cada push y pull request hacia las ramas del proyecto.
on:
  push:
    branches: [developer, certification, master]
  pull_request:
    branches: [developer, certification, master]

permissions:
  contents: read
  pull-requests: read

jobs:
  pipeline-y-calidad:
    runs-on: ubuntu-latest
    env:
      # Si todavia no se configuro el secreto SONAR_TOKEN, el analisis de SonarCloud se omite y el resto del flujo sigue.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # SonarCloud necesita el historial completo

      - name: Instalar Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Entrenar y evaluar los modelos (flujo reproducible)
        working-directory: mlops_pipeline/src
        run: python model_training_evaluation.py

      - name: Reporte de data drift
        working-directory: mlops_pipeline/src
        run: python model_monitoring.py

      - name: Pruebas unitarias con cobertura
        run: python -m pytest --cov-config=tests/.coveragerc --cov --cov-report=xml --cov-report=term

      - name: Analisis de SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
